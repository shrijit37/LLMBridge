name: Deploy Prod (Dokploy)

on:
  push:
    branches: [prod, master, main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test & Build Prod Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Build
        run: pnpm build

      - name: Run Test Suite
        run: pnpm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=prod
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=prod-

      - name: Build and push Multi-Arch Prod Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Dokploy Prod Deployment
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Webhook
        if: ${{ env.DOKPLOY_PROD_WEBHOOK != '' }}
        env:
          DOKPLOY_PROD_WEBHOOK: ${{ secrets.DOKPLOY_PROD_WEBHOOK_URL }}
        run: |
          echo "Triggering Dokploy Prod deployment webhook..."
          curl -fsS -X POST "${DOKPLOY_PROD_WEBHOOK}" || echo "Webhook trigger completed"

      - name: Verify Prod Gateway Health
        env:
          PROD_URL: ${{ secrets.PROD_GATEWAY_URL || 'https://ccs.shrijit.tech' }}
        run: |
          echo "Waiting for Prod Gateway deployment to become healthy at ${PROD_URL}/health..."
          for i in {1..15}; do
            if curl -fsS -m 5 "${PROD_URL}/health" | grep -q '"status":"ok"'; then
              echo "Prod Gateway is healthy!"
              exit 0
            fi
            echo "Attempt $i: Gateway not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Prod Gateway health check probe finished."
