name: CI

on:
  push:
    branches: [master, main, dev, prod]
  pull_request:
    branches: [master, main, dev, prod]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Build
        run: pnpm build

      - name: Run Test Suite
        run: pnpm test

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate CCS Gateway Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ccs-ts:ci-test

      - name: Validate Lane Egress Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: ./container/lane-egress
          file: ./container/lane-egress/Dockerfile
          push: false
          tags: lane-egress:ci-test
