name: Deploy Dev (Dokploy)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test & Build Dev Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Build
        run: pnpm build

      - name: Run Test Suite
        run: pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push Dev Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Dokploy Dev Deployment
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Webhook
        if: ${{ env.DOKPLOY_DEV_WEBHOOK != '' }}
        env:
          DOKPLOY_DEV_WEBHOOK: ${{ secrets.DOKPLOY_DEV_WEBHOOK_URL }}
        run: |
          echo "Triggering Dokploy Dev deployment webhook..."
          curl -fsS -X POST "${DOKPLOY_DEV_WEBHOOK}" || echo "Webhook trigger completed"

      - name: Verify Dev Gateway Health
        env:
          DEV_URL: ${{ secrets.DEV_GATEWAY_URL || 'https://ccs-dev.shrijit.tech' }}
        run: |
          echo "Waiting for Dev Gateway deployment to become healthy at ${DEV_URL}/health..."
          for i in {1..15}; do
            if curl -fsS -m 5 "${DEV_URL}/health" | grep -q '"status":"ok"'; then
              echo "Dev Gateway is healthy!"
              exit 0
            fi
            echo "Attempt $i: Gateway not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Dev Gateway health check probe finished."
