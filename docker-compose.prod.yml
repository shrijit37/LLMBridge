# Prod Stack for CCS Gateway (hooks into live dokploy-network & shared lane-egress without modifying it)
services:
  ccs-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: ccs-ts:prod
    container_name: ccs-gateway-prod
    restart: unless-stopped
    ports:
      - "${CCS_PROD_PORT:-7896}:7896"
    environment:
      - NODE_ENV=production
      - CCS_CONFIG_DIR=/app/config
      - PORT=7896
      - LANE_TOKEN=${LANE_TOKEN:-}
    volumes:
      - ccs-prod-config:/app/config
      - ccs-prod-data:/app/data
    networks:
      - default
      - dokploy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7896/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  ccs-prod-config:
  ccs-prod-data:

networks:
  dokploy:
    external: true
    name: dokploy-network
