# Dev Stack for CCS Gateway (hooks into live dokploy-network & shared lane-egress without modifying it)
services:
  ccs-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ccs-ts:dev
    container_name: ccs-gateway-dev
    restart: unless-stopped
    ports:
      # Shifted port 7897 for dev host access to avoid port collision with prod
      - "${CCS_DEV_PORT:-7897}:7896"
    environment:
      - NODE_ENV=development
      - CCS_CONFIG_DIR=/app/config
      - PORT=7896
      - LANE_TOKEN=${LANE_TOKEN:-}
    volumes:
      - ccs-dev-config:/app/config
      - ccs-dev-data:/app/data
    networks:
      - default
      - dokploy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7896/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  ccs-dev-config:
  ccs-dev-data:

networks:
  dokploy:
    external: true
    name: dokploy-network
