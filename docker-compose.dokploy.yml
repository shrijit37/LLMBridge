# Dokploy Compose stack for CCS Gateway hooked into live Dokploy network & existing lane-egress
services:
  ccs:
    build:
      context: .
      dockerfile: Dockerfile
    image: ccs-ts:latest
    restart: unless-stopped
    ports:
      - "${CCS_PORT:-7896}:7896"
    environment:
      - CCS_CONFIG_DIR=/app/config
      - PORT=7896
      - LANE_TOKEN=${LANE_TOKEN:-}
    volumes:
      - ccs-config:/app/config
      - ccs-data:/app/data
    networks:
      - default
      - dokploy

volumes:
  ccs-config:
  ccs-data:

networks:
  dokploy:
    external: true
    name: dokploy-network
