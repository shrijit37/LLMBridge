# Standalone Docker Compose stack for CCS Gateway + VPN Lane Egress
services:
  ccs:
    build:
      context: .
      dockerfile: Dockerfile
    image: ccs-ts:latest
    container_name: ccs-gateway
    restart: unless-stopped
    ports:
      - "${CCS_PORT:-7896}:7896"
    environment:
      - CCS_CONFIG_DIR=/app/config
      - PORT=7896
      - LANE_TOKEN=${LANE_TOKEN:-}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    depends_on:
      lane-egress:
        condition: service_healthy
    networks:
      - ccs-network

  lane-egress:
    build:
      context: ./container/lane-egress
      dockerfile: Dockerfile
    image: lane-egress:local
    container_name: ccs-lane-egress
    restart: unless-stopped
    environment:
      LANE_TOKEN: ${LANE_TOKEN:?set LANE_TOKEN in .env}
      NORD_TOKEN: ${NORD_TOKEN:?set NORD_TOKEN in .env}
      LANES: "8001,8002,8003,8004"
      LANE_MODE: socks5
      PROBE_SURFACES: "chat"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS -H "Authorization: Bearer $$LANE_TOKEN" "http://127.0.0.1:9100/v1/status?port=all" >/dev/null || exit 1',
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    ports:
      - "127.0.0.1:8001-8004:8001-8004"
      - "127.0.0.1:9100:9100"
    networks:
      - ccs-network

networks:
  ccs-network:
    driver: bridge
